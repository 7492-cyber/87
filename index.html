<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агенты 87: Миссия "Здоровый Выбор"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #5bc0f7 0%, #87ceeb 50%, #a8e6cf 100%);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        /* ===== ЗАГРУЗОЧНЫЙ ЭКРАН ===== */
        #loadingScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 50%, #ffa502 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease-out;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .logo-main {
            animation: logoBounce 1.5s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.4));
        }

        @keyframes logoBounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .loading-title {
            color: white;
            font-size: 36px;
            font-weight: 900;
            margin-top: 30px;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            letter-spacing: 3px;
            animation: titleWobble 2s ease-in-out infinite;
            -webkit-text-stroke: 2px rgba(0,0,0,0.2);
        }

        @keyframes titleWobble {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05) rotate(-2deg); }
            75% { transform: scale(1.05) rotate(2deg); }
        }

        .loading-subtitle {
            color: rgba(255,255,255,0.95);
            font-size: 18px;
            margin-top: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .loading-bar {
            width: 240px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border: 4px solid white;
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2ed573, #7bed9f);
            animation: loadProgress 2s ease-out forwards;
        }

        @keyframes loadProgress {
            to { width: 100%; }
        }

        /* ===== ГЛАВНЫЙ ЭКРАН ===== */
        #gameScreen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            position: relative;
        }

        #gameScreen.active {
            display: flex;
        }

        /* ===== РОБЛОКС ФОН ===== */
        .roblox-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #5bc0f7 0%, #87ceeb 60%, #a8e6cf 100%);
        }

        /* Блочные облака */
        .block-cloud {
            position: absolute;
            background: white;
            box-shadow: 
                inset -4px -4px 0 rgba(0,0,0,0.1),
                inset 4px 4px 0 rgba(255,255,255,0.5),
                4px 4px 0 rgba(0,0,0,0.2);
            animation: cloudMove linear infinite;
        }

        .block-cloud::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 20%;
            width: 60%;
            height: 100%;
            background: white;
            box-shadow: 
                inset -4px -4px 0 rgba(0,0,0,0.1),
                inset 4px 4px 0 rgba(255,255,255,0.5);
        }

        .block-cloud::after {
            content: '';
            position: absolute;
            top: -30%;
            left: 50%;
            width: 40%;
            height: 80%;
            background: white;
            box-shadow: 
                inset -4px -4px 0 rgba(0,0,0,0.1),
                inset 4px 4px 0 rgba(255,255,255,0.5);
        }

        @keyframes cloudMove {
            from { transform: translateX(500px); }
            to { transform: translateX(-250px); }
        }

        /* Блочные здания */
        .block-buildings {
            position: absolute;
            bottom: 150px;
            width: 200%;
            height: 200px;
            animation: buildingsMove 25s linear infinite;
        }

        @keyframes buildingsMove {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .block-building {
            position: absolute;
            bottom: 0;
            box-shadow: 
                inset -6px -6px 0 rgba(0,0,0,0.2),
                inset 6px 6px 0 rgba(255,255,255,0.2),
                6px 0 0 rgba(0,0,0,0.15);
        }

        .block-window {
            position: absolute;
            background: #ffeaa7;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.3);
        }

        /* Блочная земля */
        .block-ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(180deg, #7bed9f 0%, #2ed573 100%);
            border-top: 6px solid #26ae60;
            box-shadow: inset 0 6px 0 rgba(255,255,255,0.3);
        }

        .block-ground-pattern {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(90deg, 
                    transparent 0px, 
                    transparent 48px, 
                    rgba(0,0,0,0.15) 48px, 
                    rgba(0,0,0,0.15) 52px);
            animation: groundMove 2s linear infinite;
        }

        @keyframes groundMove {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Блочные деревья */
        .block-tree {
            position: absolute;
            bottom: 150px;
            width: 40px;
            height: 80px;
        }

        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 30px;
            background: #8b4513;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.3);
        }

        .tree-leaves {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 50px;
            background: #2ed573;
            box-shadow: 
                inset -4px -4px 0 rgba(0,0,0,0.2),
                inset 4px 4px 0 rgba(255,255,255,0.3);
        }

        /* ===== ПАНЕЛЬ СТАТИСТИКИ ===== */
        .stats-panel {
            background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 6px solid #2c3e50;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            z-index: 50;
            position: relative;
        }

        .score-display {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: #ffeaa7;
            padding: 6px 12px;
            border: 4px solid #2c3e50;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .score-label {
            font-size: 10px;
            color: #2c3e50;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 26px;
            font-weight: 900;
            color: #ff4757;
            line-height: 1;
            -webkit-text-stroke: 1px rgba(0,0,0,0.2);
        }

        .timer-display {
            position: relative;
            width: 64px;
            height: 64px;
            background: #ff4757;
            border: 4px solid #2c3e50;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-svg {
            position: absolute;
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: rgba(0,0,0,0.3);
            stroke-width: 4;
        }

        .timer-progress {
            fill: none;
            stroke: #2ed573;
            stroke-width: 4;
            stroke-linecap: square;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-text {
            font-size: 22px;
            font-weight: 900;
            color: white;
            z-index: 2;
            -webkit-text-stroke: 1px rgba(0,0,0,0.3);
        }

        .timer-danger {
            background: #ff4757;
            animation: timerShake 0.3s ease-in-out infinite;
        }

        .timer-danger .timer-text {
            animation: timerPulse 0.5s ease-in-out infinite;
        }

        .timer-danger .timer-progress {
            stroke: #ffffff;
        }

        @keyframes timerShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .best-score {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            background: #7bed9f;
            padding: 6px 12px;
            border: 4px solid #2c3e50;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .best-label {
            font-size: 10px;
            color: #2c3e50;
            font-weight: 900;
            text-transform: uppercase;
        }

        .best-value {
            font-size: 18px;
            font-weight: 900;
            color: #ff4757;
            -webkit-text-stroke: 1px rgba(0,0,0,0.2);
        }

        /* ===== ИГРОВОЕ ПОЛЕ ===== */
        .game-field {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* ===== РОБЛОКС ПЕРСОНАЖ ===== */
        .character {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 160px;
            z-index: 10;
            animation: characterJump 0.6s ease-in-out infinite;
            filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.3));
        }

        @keyframes characterJump {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-15px); }
        }

        .character svg {
            width: 100%;
            height: 100%;
        }

        .char-arm-left {
            transform-origin: 30px 75px;
            animation: armSwingL 0.6s ease-in-out infinite;
        }

        .char-arm-right {
            transform-origin: 70px 75px;
            animation: armSwingR 0.6s ease-in-out infinite;
        }

        @keyframes armSwingL {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(20deg); }
        }

        @keyframes armSwingR {
            0%, 100% { transform: rotate(20deg); }
            50% { transform: rotate(-20deg); }
        }

        .char-leg-left {
            transform-origin: 40px 120px;
            animation: legSwingL 0.6s ease-in-out infinite;
        }

        .char-leg-right {
            transform-origin: 60px 120px;
            animation: legSwingR 0.6s ease-in-out infinite;
        }

        @keyframes legSwingL {
            0%, 100% { transform: rotate(-25deg); }
            50% { transform: rotate(25deg); }
        }

        @keyframes legSwingR {
            0%, 100% { transform: rotate(25deg); }
            50% { transform: rotate(-25deg); }
        }

        /* ===== КАРТОЧКА СИТУАЦИИ ===== */
        .situation-card {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            width: 92%;
            background: white;
            border: 6px solid #2c3e50;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            z-index: 20;
            animation: cardSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            overflow: hidden;
        }

        @keyframes cardSlideIn {
            to { transform: translateX(-50%) translateY(0); }
        }

        .situation-card.hiding {
            animation: cardSlideOut 0.3s ease-in forwards;
        }

        @keyframes cardSlideOut {
            to { 
                transform: translateX(-50%) translateY(-150%) scale(0.8);
                opacity: 0;
            }
        }

        .card-header {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            padding: 12px;
            border-bottom: 4px solid #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .situation-icon {
            width: 40px;
            height: 40px;
            background: white;
            border: 3px solid #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .situation-text {
            font-size: 14px;
            color: white;
            font-weight: 900;
            line-height: 1.3;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
            flex: 1;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
        }

        .choice-btn {
            padding: 12px 15px;
            border: 4px solid #2c3e50;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            color: white;
            position: relative;
            overflow: hidden;
            text-align: left;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            transition: all 0.15s;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
            font-family: inherit;
        }

        .choice-btn:nth-child(1) {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
        }

        .choice-btn:nth-child(2) {
            background: linear-gradient(135deg, #3742fa 0%, #5352ed 100%);
        }

        .choice-btn:nth-child(3) {
            background: linear-gradient(135deg, #2ed573 0%, #7bed9f 100%);
        }

        .choice-btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .choice-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .choice-btn.correct {
            animation: correctPop 0.5s ease-out;
            border-color: #2ed573;
        }

        .choice-btn.wrong {
            animation: wrongShake 0.4s ease-out;
            border-color: #ff4757;
        }

        .choice-btn.joke {
            animation: jokeFlash 1s ease-out;
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes jokeFlash {
            0%, 100% { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); }
            50% { background: linear-gradient(135deg, #ffa502 0%, #ff6348 100%); }
        }

        /* ===== ЭФФЕКТЫ ===== */
        .points-popup {
            position: absolute;
            font-size: 36px;
            font-weight: 900;
            z-index: 30;
            pointer-events: none;
            animation: pointsFloat 1.5s ease-out forwards;
            -webkit-text-stroke: 2px rgba(0,0,0,0.3);
            font-family: inherit;
        }

        @keyframes pointsFloat {
            0% {
                transform: translateY(0) scale(0.5) rotate(-10deg);
                opacity: 0;
            }
            20% {
                transform: translateY(-20px) scale(1.3) rotate(5deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1) rotate(0deg);
                opacity: 0;
            }
        }

        .points-positive {
            color: #2ed573;
        }

        .points-negative {
            color: #ff4757;
        }

        .points-joke {
            color: #ffa502;
        }

        .joke-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffa502;
            color: white;
            padding: 15px 25px;
            border: 4px solid #2c3e50;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            font-size: 16px;
            font-weight: 900;
            z-index: 40;
            text-align: center;
            animation: jokeMessagePop 2s ease-out forwards;
            -webkit-text-stroke: 1px rgba(0,0,0,0.2);
        }

        @keyframes jokeMessagePop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8) rotate(10deg); opacity: 0; }
        }

        .particle {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 25;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .particle-block {
            animation: particleFly 1.2s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                transform: translate(0, 0) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== ЭКРАН РЕЗУЛЬТАТОВ ===== */
        #resultScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 30%, #ffa502 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        #resultScreen.active {
            display: flex;
            animation: resultFadeIn 0.8s ease-out;
        }

        @keyframes resultFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 15px;
            animation: logoBounce 1.5s ease-in-out infinite;
            filter: drop-shadow(6px 6px 0 rgba(0,0,0,0.3));
        }

        .result-title {
            font-size: 30px;
            color: white;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            text-align: center;
            -webkit-text-stroke: 1px rgba(0,0,0,0.2);
        }

        .result-school {
            color: white;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 6px 16px;
            border: 3px solid white;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .result-score-container {
            background: white;
            border: 6px solid #2c3e50;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            padding: 20px 40px;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-score-label {
            color: #2c3e50;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .result-score {
            font-size: 68px;
            color: #ff4757;
            font-weight: 900;
            line-height: 1;
            -webkit-text-stroke: 2px rgba(0,0,0,0.2);
            animation: scorePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scorePop {
            from { transform: scale(0) rotate(-20deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .result-level {
            background: #2ed573;
            color: white;
            padding: 10px 25px;
            border: 4px solid #2c3e50;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            animation: levelPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
        }

        .result-level.master {
            background: #3742fa;
        }

        .result-level.expert {
            background: linear-gradient(135deg, #ffa502 0%, #ff6348 100%);
        }

        @keyframes levelPop {
            from { transform: scale(0) rotate(-15deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .result-stats {
            background: white;
            border: 6px solid #2c3e50;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            padding: 15px;
            width: 100%;
            margin-bottom: 15px;
        }

        .result-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 3px dashed #2c3e50;
        }

        .result-stat-row:last-child {
            border-bottom: none;
        }

        .result-stat-label {
            font-size: 13px;
            color: #2c3e50;
            font-weight: 800;
        }

        .result-stat-value {
            font-size: 18px;
            font-weight: 900;
            color: #ff4757;
            -webkit-text-stroke: 1px rgba(0,0,0,0.2);
        }

        .share-section {
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.2);
            border: 3px solid white;
            padding: 12px;
        }

        .share-text {
            color: white;
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.4;
            font-weight: 800;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .share-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .share-btn {
            padding: 10px 18px;
            border: 4px solid #2c3e50;
            font-size: 13px;
            font-weight: 900;

        let gameState = {
            score: 0,

            correctAnswers: 0,
            totalAnswered: 0,
            timeLeft: 40,
            maxTime: 40,
            timerInterval: null,
            questionsQueue: [],
            bestScore: parseInt(localStorage.getItem('agents87_bestScore_v2') || '0'),
            isGameActive: false
        };

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        window.addEventListener('load', () => {
            document.getElementById('bestScore').textContent = gameState.bestScore;
            
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.add('active');
                setTimeout(() => startGame(), 500);
            }, 2500);
        });

        // ===== ЛОГИКА ИГРЫ =====
        function startGame() {
            // Перемешиваем вопросы и берём 15
            gameState.questionsQueue = shuffleArray([...questions]).slice(0, 15);
            gameState.score = 0;
            gameState.currentQuestion = 0;
            gameState.correctAnswers = 0;
            gameState.totalAnswered = 0;
            gameState.timeLeft = 40;
            gameState.isGameActive = true;
            
            updateScoreDisplay();
            updateTimerDisplay();
            startTimer();
            showNextQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startTimer() {
            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                updateTimerDisplay();
                
                if (gameState.timeLeft <= 10) {
                    document.getElementById('timerDisplay').classList.add('timer-danger');
                }
                
                if (gameState.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const progress = document.getElementById('timerProgress');
            const text = document.getElementById('timerText');
            const circumference = 192;
            const offset = circumference * (1 - gameState.timeLeft / gameState.maxTime);
            
            progress.style.strokeDashoffset = offset;
            text.textContent = gameState.timeLeft;
        }

        function updateScoreDisplay() {
            document.getElementById('scoreValue').textContent = gameState.score;
        }

        function showNextQuestion() {
            if (gameState.currentQuestion >= gameState.questionsQueue.length || !gameState.isGameActive) {
                endGame();
                return;
            }

            const question = gameState.questionsQueue[gameState.currentQuestion];
            const gameField = document.getElementById('gameField');
            
            const card = document.createElement('div');
            card.className = 'situation-card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="situation-icon">${question.icon}</div>
                    <div class="situation-text">${question.text}</div>
                </div>
                <div class="choices">
                    ${question.choices.map((choice, index) => 
                        `<button class="choice-btn" onclick="makeChoice(${index}, this)">${choice.text}</button>`
                    ).join('')}
                </div>
            `;
            
            gameField.appendChild(card);
        }

        function makeChoice(choiceIndex, buttonElement) {
            if (!gameState.isGameActive) return;
            
            const question = gameState.questionsQueue[gameState.currentQuestion];
            const choice = question.choices[choiceIndex];
            
            // Блокируем все кнопки
            const allButtons = document.querySelectorAll('.choice-btn');
            allButtons.forEach(btn => btn.disabled = true);
            
            // Обработка "пасхалки" с вопросом "Кто круче?"
            if (choice.isJokeChoice) {
                buttonElement.classList.add('joke');
                showJokeMessage(choice.jokeMessage || "Правильно — директор!");
                showPointsPopup(`+${choice.points}`, 'joke');
                createParticles('#ffa502');
                gameState.score += choice.points;
                gameState.correctAnswers++;
                gameState.totalAnswered++;
                // Бонусное время
                gameState.timeLeft = Math.min(gameState.maxTime, gameState.timeLeft + 3);
            } else {
                // Обычная обработка
                if (choice.correct) {
                    buttonElement.classList.add('correct');
                    createParticles('#2ed573');
                    showPointsPopup(`+${choice.points}`, 'positive');
                    gameState.correctAnswers++;
                    gameState.timeLeft = Math.min(gameState.maxTime, gameState.timeLeft + 3);
                } else {
                    buttonElement.classList.add('wrong');
                    createParticles('#ff4757');
                    if (choice.points < 0) {
                        showPointsPopup(`${choice.points}`, 'negative');
                    } else {
                        showPointsPopup('0', 'negative');
                    }
                }
                
                gameState.score = Math.max(0, gameState.score + choice.points);
                gameState.totalAnswered++;
            }
            
            updateScoreDisplay();
            
            // Переход к следующему вопросу
            setTimeout(() => {
                const card = document.querySelector('.situation-card');
                if (card) {
                    card.classList.add('hiding');
                    setTimeout(() => {
                        card.remove();
                        gameState.currentQuestion++;
                        showNextQuestion();
                    }, 300);
                }
            }, question.isJoke ? 2000 : 800);
        }

        function showPointsPopup(text, type) {
            const popup = document.createElement('div');
            popup.className = `points-popup points-${type}`;
            popup.textContent = text;
            popup.style.left = '50%';
            popup.style.top = '50%';
            popup.style.transform = 'translate(-50%, -50%)';
            document.getElementById('gameField').appendChild(popup);
            
            setTimeout(() => popup.remove(), 1500);
        }

        function showJokeMessage(message) {
            const jokeMsg = document.createElement('div');
            jokeMsg.className = 'joke-message';
            jokeMsg.textContent = message;
            document.getElementById('gameField').appendChild(jokeMsg);
            
            setTimeout(() => jokeMsg.remove(), 2000);
        }

        function createParticles(color) {
            const gameField = document.getElementById('gameField');
            const centerX = gameField.offsetWidth / 2;
            const centerY = gameField.offsetHeight / 2;
            
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle particle-block';
                particle.style.background = color;
                particle.style.border = '2px solid #2c3e50';
                
                const angle = (Math.PI * 2 * i) / 10;
                const distance = 80 + Math.random() * 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                gameField.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function endGame() {
            gameState.isGameActive = false;
            clearInterval(gameState.timerInterval);
            
            // Сохраняем рекорд
            if (gameState.score > gameState.bestScore) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('agents87_bestScore_v2', gameState.bestScore.toString());
            }

            setTimeout(() => {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('resultScreen').classList.add('active');
                
                document.getElementById('finalScore').textContent = gameState.score;
                document.getElementById('correctCount').textContent = gameState.correctAnswers;
                document.getElementById('totalCount').textContent = gameState.totalAnswered;
                document.getElementById('finalBest').textContent = gameState.bestScore;

                    level = 'ЭКСПЕРТ ПРОФИЛАКТИКИ 🏆';
                    levelEl.classList.add('expert');
                } else if (gameState.score >= 500) {
                    level = 'МАСТЕР ПРОФИЛАКТИКИ ⭐';
                    levelEl.classList.add('master');
                }
                levelEl.textContent = level;
            }, 500);
        }

        function restartGame() {
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('timerDisplay').classList.remove('timer-danger');
            document.getElementById('bestScore').textContent = gameState.bestScore;
            
            setTimeout(() => startGame(), 300);
        }

        // ===== ФУНКЦИИ "ПОДЕЛИТЬСЯ" =====
        function getShareText() {
            let level = 'Новичок профилактики';
            if (gameState.score >= 1000) level = 'Эксперт профилактики 🏆';
            else if (gameState.score >= 500) level = 'Мастер профилактики ⭐';
            
            return `🎮 Агенты 87: Миссия "Здоровый Выбор"\n🏫 МАОУ СОШ №87\n\n🏆 Мой результат: ${gameState.score} очков\n${level}\n✅ Правильных ответов: ${gameState.correctAnswers}/${gameState.totalAnswered}\n\nСможешь меня обойти?`;
        }

        function shareResult() {
            const text = getShareText();
            
            if (navigator.share) {
                navigator.share({
                    title: 'Агенты 87: Миссия "Здоровый Выбор"',
                    text: text
                }).catch(() => {
                    copyToClipboard(text);
                });
            } else {
                copyToClipboard(text);
                showToast('📸 Сделай скриншот и отправь друзьям!');
            }
        }

        function copyResult() {
            const text = getShareText();
            copyToClipboard(text);
            showToast('✅ Текст скопирован! Сделай скрин и отправь друзьям');
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
            } catch (e) {
                console.error('Copy failed', e);
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
